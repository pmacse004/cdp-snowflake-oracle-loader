# =============================================================================
# CDP Snowflake-to-Oracle Loader — Application Configuration
# =============================================================================
# This file contains ONLY non-secret, environment-agnostic configuration.
# Secrets and environment-specific values are injected via environment variables.
# Environment variable reference: docs/operations/environment-variables.md
# =============================================================================

spring:
  application:
    name: cdp-snowflake-oracle-loader

  # ---------------------------------------------------------------------------
  # Oracle DataSource is explicitly configured in DataSourceConfig (cdp-loader-batch).
  # Built from CDP_ORACLE_JDBC_URL / CDP_ORACLE_USERNAME / CDP_ORACLE_PASSWORD env vars.
  # Spring Boot DataSourceAutoConfiguration is excluded in CdpLoaderApplication to
  # prevent a conflicting auto-configured datasource bean.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # JPA — DDL managed by Flyway; Hibernate must NOT auto-create
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        default_schema: "${CDP_ORACLE_USERNAME:CDP_LOADER}"
        jdbc:
          batch_size: 100
          order_inserts: true
          order_updates: true

  # ---------------------------------------------------------------------------
  # Flyway — Oracle DDL migrations
  # Flyway runs against the @Primary (Oracle) datasource automatically.
  # spring.batch.jdbc.initialize-schema=never because Flyway V001 already ran.
  # ---------------------------------------------------------------------------
  flyway:
    enabled:            true
    locations:          classpath:db/migration
    default-schema:     "${CDP_ORACLE_USERNAME:CDP_LOADER}"
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order:       false

  # ---------------------------------------------------------------------------
  # Spring Batch — job repository on Oracle; do NOT auto-run jobs on start
  # ---------------------------------------------------------------------------
  batch:
    jdbc:
      initialize-schema: never
      isolation-level-for-create: READ_COMMITTED
    job:
      enabled: false

  # ---------------------------------------------------------------------------
  # Jackson
  # ---------------------------------------------------------------------------
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# =============================================================================
# CDP application configuration
# =============================================================================
cdp:
  snowflake:
    account:          "${CDP_SNOWFLAKE_ACCOUNT}"           # QI79280.ap-southeast-7.aws
    user:             "${CDP_SNOWFLAKE_USER}"              # SVC_CDP_LOADER
    role:             "${CDP_SNOWFLAKE_ROLE}"              # CDP_LOADER_ROLE
    warehouse:        "${CDP_SNOWFLAKE_WAREHOUSE}"         # CDP_LOADER_WH
    database:         "${CDP_SNOWFLAKE_DATABASE}"          # CDP_UTIL_DB
    private-key-path: "${CDP_SNOWFLAKE_PRIVATE_KEY_PATH}"  # absolute path to .p8 file
    # Absolute path to config/sf_client_config.json.
    # Passed as client_config_file in the Snowflake JDBC URL.
    # Prevents InvalidPathException when running from a fat JAR on Windows.
    # Set SF_CLIENT_CONFIG_FILE env var; start-backend.ps1 resolves to absolute path.
    client-config-file: "${SF_CLIENT_CONFIG_FILE}"
    pool:
      min-connections: 1
      max-connections: 5
      login-timeout:   60

  oracle:
    schema: "${CDP_ORACLE_USERNAME:CDP_LOADER}"

  batch:
    chunk-size:               500
    fatal-error-threshold:    100
    fetch-size:               1000
    initial-load:
      enabled:     true
      parallelism: 1
    daily-load:
      enabled:          true
      schedule:         "${CDP_DAILY_LOAD_CRON:0 0 2 * * ?}"
      schedule-enabled: "${CDP_DAILY_LOAD_SCHEDULE_ENABLED:false}"
    monthly-load:
      enabled:          true
      schedule:         "${CDP_MONTHLY_LOAD_CRON:0 0 3 1 * ?}"
      schedule-enabled: "${CDP_MONTHLY_LOAD_SCHEDULE_ENABLED:false}"

  reconciliation:
    count-tolerance-pct:   0.0
    kwh-tolerance-pct:     0.001
    amount-tolerance-pct:  0.001

  mapping-catalogue:
    location: "classpath:ica/mapping-catalogue.yaml"

# =============================================================================
# Spring Boot Actuator
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,flyway,batch"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true

# =============================================================================
# Logging
# =============================================================================
logging:
  level:
    root:                              INFO
    com.ibm.cdp:                       DEBUG
    org.springframework.batch:         INFO
    org.flywaydb:                      INFO
    net.snowflake:                     WARN
    oracle.jdbc:                       WARN
    org.springframework.batch.core.launch.support: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# =============================================================================
# SpringDoc / OpenAPI
# =============================================================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true

# =============================================================================
# Server
# =============================================================================
server:
  port: 8080
