# =============================================================================
# ICA/MCP Context — Column Mappings
# =============================================================================
# Authoritative column-level mapping matrix derived directly from DDL:
#   SOURCE: infra/snowflake/03-create-source-tables.sql
#           infra/snowflake/04-create-export-views.sql (view column aliases)
#   TARGET: V004__create_target_business_tables.sql
#
# Format per mapping entry:
#   source_view   — Snowflake STAGING view column name
#   source_table  — underlying Snowflake table.column (if direct)
#   java_type     — Java type used in domain model / processor
#   transformation — computation applied (DIRECT = pass-through)
#   validation    — validation rule codes applied in processor
#   oracle_table  — target Oracle table
#   oracle_column — target Oracle column
#   merge_key     — Y if this column is part of the MERGE ON clause
#   notes         — cross-reference / caveats
#
# ICA rule codes: TR-* = transformation, VR-* = validation,
#                 MU-* = monthly usage, MK-* = merge key
# =============================================================================

version: "1.0"
context_package: cdp-snowflake-oracle-loader
artifact: column-mappings

# ============================================================================
# ENTITY: Customer  (VW_DAILY_CUSTOMER_EXPORT → TGT_CUSTOMER)
# ============================================================================
customer_mappings:

  - source_view: CUSTOMER_ID
    source_table: CUSTOMER.CUSTOMER.CUSTOMER_ID
    java_type: String
    transformation: DIRECT
    validation: [VR-CUST-001]   # required, not blank
    oracle_table: TGT_CUSTOMER
    oracle_column: CUSTOMER_ID
    merge_key: Y
    notes: Business primary key. Max 20 chars.

  - source_view: FIRST_NAME
    source_table: CUSTOMER.CUSTOMER.FIRST_NAME
    java_type: String
    transformation: DIRECT
    validation: [VR-CUST-002]   # required
    oracle_table: TGT_CUSTOMER
    oracle_column: FIRST_NAME
    merge_key: N

  - source_view: LAST_NAME
    source_table: CUSTOMER.CUSTOMER.LAST_NAME
    java_type: String
    transformation: DIRECT
    validation: [VR-CUST-002]
    oracle_table: TGT_CUSTOMER
    oracle_column: LAST_NAME
    merge_key: N

  - source_view: MIDDLE_NAME
    source_table: CUSTOMER.CUSTOMER.MIDDLE_NAME
    java_type: String
    transformation: DIRECT
    validation: []
    oracle_table: TGT_CUSTOMER
    oracle_column: MIDDLE_NAME
    merge_key: N
    notes: Nullable.

  - source_view: NAME_SUFFIX
    source_table: CUSTOMER.CUSTOMER.NAME_SUFFIX
    java_type: String
    transformation: DIRECT
    validation: []
    oracle_table: TGT_CUSTOMER
    oracle_column: NAME_SUFFIX
    merge_key: N
    notes: Nullable.

  - source_view: FULL_NAME_NORMALIZED
    source_table: "(derived in view)"
    java_type: String
    transformation: >
      TR-COMB-01: TRIM(UPPER(FIRST_NAME) || ' ' || COALESCE(UPPER(MIDDLE_NAME)||' ','') || UPPER(LAST_NAME))
      Computed by view; passed through as-is.  Java processor validates not blank.
    validation: [VR-CUST-002]
    oracle_table: TGT_CUSTOMER
    oracle_column: FULL_NAME_NORMALIZED
    merge_key: N
    notes: View column alias FULL_NAME_NORMALIZED.

  - source_view: CUSTOMER_TYPE
    source_table: CUSTOMER.CUSTOMER.CUSTOMER_TYPE
    java_type: String
    transformation: DIRECT
    validation: [VR-CUST-003]   # must be RESIDENTIAL|COMMERCIAL|INDUSTRIAL
    oracle_table: TGT_CUSTOMER
    oracle_column: CUSTOMER_TYPE
    merge_key: N

  - source_view: CUST_TYPE_LABEL
    source_table: "REF.CODE_VALUE.CODE_LABEL (DOMAIN=CUST_TYPE)"
    java_type: String
    transformation: DIRECT (LEFT JOIN resolved in view)
    validation: []
    oracle_table: TGT_CUSTOMER
    oracle_column: CUSTOMER_TYPE_LABEL
    merge_key: N
    notes: Nullable — may be null if code not found in ref table.

  - source_view: PREFERRED_LANGUAGE
    source_table: CUSTOMER.CUSTOMER.PREFERRED_LANGUAGE
    java_type: String
    transformation: DIRECT
    validation: []
    oracle_table: TGT_CUSTOMER
    oracle_column: PREFERRED_LANGUAGE
    merge_key: N
    notes: Default 'EN'. Oracle column has DEFAULT 'EN' NOT NULL.

  - source_view: CUSTOMER_STATUS
    source_table: "CUSTOMER.CUSTOMER.ACCOUNT_STATUS (aliased as CUSTOMER_STATUS)"
    java_type: String
    transformation: DIRECT
    validation: [VR-CUST-004]   # must be ACTIVE|INACTIVE|SUSPENDED|PENDING
    oracle_table: TGT_CUSTOMER
    oracle_column: ACCOUNT_STATUS
    merge_key: N

  - source_view: ACCT_STATUS_LABEL
    source_table: "REF.CODE_VALUE.CODE_LABEL (DOMAIN=ACCT_STATUS)"
    java_type: String
    transformation: DIRECT
    validation: []
    oracle_table: TGT_CUSTOMER
    oracle_column: ACCOUNT_STATUS_LABEL
    merge_key: N
    notes: Nullable.

  - source_view: IS_INACTIVE
    source_table: "(derived in view)"
    java_type: boolean
    transformation: >
      CASE WHEN CUSTOMER_STATUS = 'INACTIVE' THEN TRUE ELSE FALSE END
      Java: IS_ACTIVE = isInactive ? 0 : 1 (inverted for Oracle)
    validation: []
    oracle_table: TGT_CUSTOMER
    oracle_column: IS_ACTIVE
    merge_key: N
    notes: Oracle stores IS_ACTIVE (1=active, 0=inactive). View produces IS_INACTIVE boolean. Processor inverts.

  - source_view: UPDATED_AT
    source_table: CUSTOMER.CUSTOMER.UPDATED_AT
    java_type: OffsetDateTime
    transformation: "Map TIMESTAMP_TZ → java.sql.Timestamp (UTC preserved)"
    validation: []
    oracle_table: TGT_CUSTOMER
    oracle_column: SOURCE_UPDATED_AT
    merge_key: N
    notes: Stored in Oracle as TIMESTAMP (UTC). TGT_CUSTOMER.SOURCE_UPDATED_AT.

  - source_view: "(not from view)"
    source_table: N/A
    java_type: long
    transformation: "Set by Spring Batch job: ETL_JOB_RUN.RUN_ID"
    validation: []
    oracle_table: TGT_CUSTOMER
    oracle_column: ETL_RUN_ID
    merge_key: N

  - source_view: "(not from view)"
    source_table: N/A
    java_type: Instant
    transformation: "Set by writer: SYS_EXTRACT_UTC(SYSTIMESTAMP) on first INSERT only — preserved on MERGE UPDATE"
    validation: []
    oracle_table: TGT_CUSTOMER
    oracle_column: CREATED_AT
    merge_key: N
    notes: Oracle DEFAULT handles INSERT; MERGE must NOT overwrite on UPDATE.

  - source_view: "(not from view)"
    source_table: N/A
    java_type: Instant
    transformation: "Set by writer on every MERGE UPDATE: current UTC"
    validation: []
    oracle_table: TGT_CUSTOMER
    oracle_column: UPDATED_AT
    merge_key: N

  # Columns intentionally not mapped (present in source, not in export view):
  # DATE_OF_BIRTH — excluded from VW_DAILY_CUSTOMER_EXPORT (PII — not required for CDP)
  # SSN_LAST4     — excluded from VW_DAILY_CUSTOMER_EXPORT (PII)
  # STATUS_REASON — excluded from VW_DAILY_CUSTOMER_EXPORT
  # EMAIL_ADDRESS / EMAIL_VERIFIED / PHONE_NUMBER — loaded into TGT_CUSTOMER_CONTACT (separate entity)

