# =============================================================================
# ICA/MCP Context — Error Handling Rules
# =============================================================================
# Defines how ETL errors are classified, recorded, and surfaced.
# Implementation: EtlRecordErrorRepository.java + ETL_RECORD_ERROR table (V003)
# =============================================================================

version: "1.0"
context_package: cdp-snowflake-oracle-loader
artifact: error-handling-rules

# ============================================================================
# Error classification
# ============================================================================
error_classes:

  - class: VALIDATION_ERROR
    description: Record-level data quality failure detected in Spring Batch processor.
    exception: com.ibm.cdp.loader.core.exception.RecordValidationException
    spring_batch_handling: Skip — record written to ETL_RECORD_ERROR; job continues.
    examples:
      - Missing CUSTOMER_ID (VR-CUST-001)
      - Invalid CUSTOMER_TYPE (VR-CUST-003)
      - Negative KWH_USAGE (VR-USG-008) — intentional USG-INVK-*
      - BILL_END_DATE < BILL_START_DATE (VR-USG-006) — intentional USG-INVD-*
      - NULL calculated charges (VR-RATE-001)

  - class: INFRASTRUCTURE_ERROR
    description: Database connectivity, configuration, or unexpected system error.
    exception: java.sql.SQLException, net.snowflake.client.jdbc.SnowflakeSQLException (non-transient)
    spring_batch_handling: Fail — job transitions to FAILED; no skip.
    examples:
      - Snowflake connection refused (key auth failure)
      - Oracle ORA-03113 (connection lost mid-batch)
      - Missing required configuration property

  - class: TRANSIENT_ERROR
    description: Temporary connectivity issue that may succeed on retry.
    exception: java.sql.SQLTransientConnectionException
    spring_batch_handling: Retry up to 3 times with exponential backoff; then FAIL.

  - class: FK_VIOLATION
    description: Oracle FK constraint violation (ORA-02291) — parent record not found.
    exception: java.sql.SQLIntegrityConstraintViolationException
    spring_batch_handling: >
      ORA-02291 for a known FK (e.g. CUSTOMER_ID missing from TGT_CUSTOMER) is treated
      as a VALIDATION_ERROR — skip and record.
      Unexpected FK violations (system data inconsistency) are INFRASTRUCTURE_ERROR.

# ============================================================================
# ETL_RECORD_ERROR table schema (V003 migration)
# ============================================================================
error_table: ETL_RECORD_ERROR
columns:
  - ERROR_ID:        NUMBER(19,0)   NOT NULL PK (sequence)
  - RUN_ID:          NUMBER(19,0)   NOT NULL  — FK to ETL_JOB_RUN
  - JOB_NAME:        VARCHAR2(100)  NOT NULL  — e.g. INITIAL_LOAD_JOB
  - SOURCE_ENTITY:   VARCHAR2(100)  NOT NULL  — e.g. CUSTOMER, ENERGY_ACCOUNT, MONTHLY_USAGE
  - SOURCE_RECORD_ID: VARCHAR2(200) NOT NULL  — the primary key of the rejected record
  - ERROR_CODE:      VARCHAR2(100)  NOT NULL  — e.g. VAL_USAGE_NEGATIVE_KWH
  - ERROR_MESSAGE:   VARCHAR2(4000)           — human-readable description
  - SOURCE_EXCERPT:  VARCHAR2(4000)           — safe excerpt of source data (no PII/secrets)
  - CREATED_AT:      TIMESTAMP      NOT NULL  — UTC timestamp of error recording

# ============================================================================
# What must NOT be stored in ETL_RECORD_ERROR
# ============================================================================
prohibited_content:
  - Private keys or key material
  - Oracle/Snowflake passwords
  - Authentication tokens
  - Full SSN or date-of-birth values
  - Full contact details in free-text fields
  rule: >
    SOURCE_EXCERPT must contain only safe diagnostic information:
    the primary key, offending column name, and the rejected value
    (not the full record).  Truncate to 4000 chars.
    Do not log SSN_LAST4 or DATE_OF_BIRTH even if they arrive in the record.

