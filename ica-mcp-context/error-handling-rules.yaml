# ============================================================================
# ETL_JOB_RUN status transitions
# ============================================================================
status_transitions:
  valid:
    - STARTING → RUNNING
    - RUNNING → COMPLETED
    - RUNNING → COMPLETED_WITH_ERRORS
    - RUNNING → FAILED
  invalid:
    - COMPLETED → any other state (terminal)
    - FAILED → any other state (terminal)
  rule: >
    COMPLETED must NOT be set when the job encountered fatal errors.
    COMPLETED_WITH_ERRORS is appropriate when some records were skipped
    (SKIP disposition) but the job otherwise processed successfully.
    FAILED is set when a fatal infrastructure or configuration error aborts the job.

# ============================================================================
# API error surfacing
# ============================================================================
api_rules:
  - Never return stack traces in HTTP responses.
  - Never return JDBC URL containing credentials.
  - Never return private key file paths.
  - Error summary in POST /jobs/* response body: HTTP 500 with generic message.
  - Detailed errors: GET /errors?runId=X (paginated ETL_RECORD_ERROR query).
  - HTTP 409 Conflict: another job of the same type is RUNNING.
  - HTTP 400: invalid request (e.g. malformed job name).
  - HTTP 503: datasource connectivity check failed (health endpoint).
